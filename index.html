<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://kit.fontawesome.com/f939710bb0.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <button id="firstBtn">
        <span>Add</span>
        <span><i class="fa-solid fa-plus"></i></span>
    </button>
    <p id="modal">Note Added Successfully</p>
    <form action="" id="form">
        <div>
            <label for="">Note Title</label>
            <input type="text" name="" id="noteTitle" placeholder="Note Title">
        </div>
        <div>
            <label for="">Note</label>
            <textarea id="noteBody" placeholder="Input Your Note"></textarea>
        </div>
        <input type="submit" value="ADD NOTE" id="submitBtn">
    </form>
    <div id="container">
      
    </div>
    <script src="app.js"></script>
</body>
</html>
